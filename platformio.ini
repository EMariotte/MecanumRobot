[platformio]
; Sketch activo — cambiar esta ruta al avanzar de paso
; (test_74hc595 → test_tb6612 → test_i2c → test_espnow → mecanum_main)
src_dir = firmware/test_tb6612

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
; Flash en modo DIO: libera GPIO10 (SD3) para el latch STCP del 74HC595.
; En QIO el flash usa GPIO9/GPIO10 y el ESP8266 se cuelga o resetea.
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = send_on_enter, colorize
