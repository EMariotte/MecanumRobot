[platformio]
; Sketch activo — cambiar esta ruta al avanzar de paso
; (test_74hc595 → test_tb6612 → test_web → test_i2c → mecanum_main)
src_dir = firmware/mecanum_main
; Archivos de la página web que se cargan a LittleFS ("Upload Filesystem Image")
data_dir = firmware/mecanum_main/data

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
; Flash en modo DIO: libera GPIO10 (SD3) para el latch STCP del 74HC595.
; En QIO el flash usa GPIO9/GPIO10 y el ESP8266 se cuelga o resetea.
board_build.flash_mode = dio
; Sistema de archivos para la página web: 1 MB programa + 2 MB LittleFS
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
monitor_filters = send_on_enter, colorize, esp8266_exception_decoder
; Librerías — solo se enlazan en los sketches que las incluyen
lib_deps =
    esp32async/ESPAsyncTCP
    esp32async/ESPAsyncWebServer
