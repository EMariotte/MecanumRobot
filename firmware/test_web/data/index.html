<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111418">
  <title>Mecanum Robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra superior: estado de conexión y telemetría -->
  <header>
    <h1>Mecanum 4WD</h1>
    <div class="estado">
      <span id="conexion" class="indicador desconectado">Sin conexión</span>
      <span id="failsafe" class="indicador aviso oculto">Failsafe</span>
      <span class="dato">Batería <b id="bateria">-- V</b></span>
      <span class="dato">Latencia <b id="latencia">--</b></span>
    </div>
  </header>

  <!-- Aviso cuando otro dispositivo toma el control -->
  <div id="aviso-tomado" class="aviso-tomado oculto">
    Otro dispositivo tomó el control del robot.
    <button id="recuperar">Recuperar control</button>
  </div>

  <main>
    <!-- Botones de dirección: mantener presionado para mover.
         El joystick los complementará en el paso 3d. -->
    <section class="panel">
      <div class="pad">
        <button class="dir" data-w="-100"  aria-label="Rotar a la izquierda">⟲</button>
        <button class="dir" data-vy="100"  aria-label="Adelante">▲</button>
        <button class="dir" data-w="100"   aria-label="Rotar a la derecha">⟳</button>
        <button class="dir" data-vx="-100" aria-label="Izquierda">◀</button>
        <span class="centro"></span>
        <button class="dir" data-vx="100"  aria-label="Derecha">▶</button>
        <span></span>
        <button class="dir" data-vy="-100" aria-label="Atrás">▼</button>
        <span></span>
      </div>
    </section>

    <section class="panel controles">
      <label>Velocidad máxima <b id="vel-valor">30%</b>
        <input type="range" id="vel-max" min="10" max="100" value="30">
      </label>
      <button id="stop" class="stop">STOP</button>

      <!-- Prueba de ruedas: dispuestas como en el robot visto desde arriba.
           Mantener presionado → solo esa rueda gira hacia ADELANTE. -->
      <div class="prueba-ruedas">
        <p>Prueba de ruedas <span>(mantener → gira adelante)</span></p>
        <div class="ruedas">
          <button class="dir rueda" data-rueda="0">FL</button>
          <span class="frente">▲ frente</span>
          <button class="dir rueda" data-rueda="1">FR</button>
          <button class="dir rueda" data-rueda="2">RL</button>
          <span></span>
          <button class="dir rueda" data-rueda="3">RR</button>
        </div>
      </div>

      <p class="enviando">Enviando <b id="cmd-actual">vx 0 · vy 0 · w 0</b></p>
    </section>
  </main>

  <footer>
    <span>Comandos recibidos <b id="hz">--</b>/s</span>
    <span>Activo <b id="uptime">--</b></span>
    <span>Memoria libre <b id="heap">--</b></span>
    <span>Dispositivos <b id="clientes">--</b></span>
    <span>Paso 3c · motores activos</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
